services:
  - type: web
    name: unitrades
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
    disk:
      name: unitrades-data
      mountPath: /var/data
      sizeGB: 1
